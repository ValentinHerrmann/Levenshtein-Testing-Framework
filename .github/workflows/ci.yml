name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Show Java version
        run: java -version

      # The examples default to the released framework from Maven Central; CI tests them against the framework of
      # this commit instead. The root build gets the version from .mvn/maven.config, which must not drift.
      - name: Determine the framework version
        run: |
          VERSION=$(./mvnw -B -q -f framework/pom.xml org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate \
            -Dexpression=project.version -DforceStdout | tail -n 1)
          test -n "$VERSION" || { echo "::error::Could not determine the framework version"; exit 1; }
          echo "Framework version: $VERSION"
          grep -qxF -- "-Dlevenshtein.version=$VERSION" .mvn/maven.config \
            || { echo "::error::.mvn/maven.config must contain -Dlevenshtein.version=$VERSION"; exit 1; }
          echo "FRAMEWORK_VERSION=$VERSION" >> "$GITHUB_ENV"

      # Framework unit tests + the example exercise under active Ares 2 supervision
      # (including the sandbox and timeout self-checks).
      - name: Build and test
        run: ./mvnw -B verify

      # The two examples are standalone copies of one exercise: keep them identical (the policies differ
      # in the programming language configuration only).
      - name: Check that both examples contain the same exercise
        run: |
          diff -r example-maven/assignment example-gradle/assignment
          diff -r -x SecurityPolicy.yaml example-maven/test example-gradle/test

      # Both examples must work when copied out of the repository. They take the framework SNAPSHOT from ~/.m2,
      # so install it first.
      - name: Install the framework locally
        run: ./mvnw -B install -pl framework -DskipTests

      - name: Build and test a copy of the Maven example
        run: |
          cp -r example-maven "$RUNNER_TEMP/example-maven"
          cd "$RUNNER_TEMP/example-maven" && ./mvnw -B verify -Dlevenshtein.version="$FRAMEWORK_VERSION"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test a copy of the Gradle example
        run: |
          cp -r example-gradle "$RUNNER_TEMP/example-gradle"
          cd "$RUNNER_TEMP/example-gradle"
          ./gradlew --no-daemon --warning-mode all test -PlevenshteinVersion="$FRAMEWORK_VERSION"
