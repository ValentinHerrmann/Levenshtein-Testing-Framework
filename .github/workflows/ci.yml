name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Show Java version
        run: java -version

      # Framework unit tests + the example exercise under active Ares 2 supervision
      # (including the sandbox and timeout self-checks).
      - name: Build and test
        run: ./mvnw -B verify

      # The Gradle twin of the example, protected by Ares 2 in the same way. It uses the framework from
      # ~/.m2, so install it first.
      - name: Install the framework locally
        run: ./mvnw -B install -pl framework -DskipTests

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test the Gradle example
        run: ./gradlew --no-daemon test
        working-directory: example-gradle
