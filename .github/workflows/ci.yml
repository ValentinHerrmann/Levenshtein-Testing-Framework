name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The jobs below are independent and run in parallel; each sets up its own JDK (and Gradle).
  framework:
    name: Framework unit tests (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Show Java version
        run: java -version

      - name: Build and test the framework
        run: ./mvnw -B -f framework/pom.xml verify

  # The example exercise under active Ares 2 supervision (including the sandbox and timeout self-checks).
  # Inside the repository both examples compile the framework source.
  example:
    name: ${{ matrix.tool }} example (framework source)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [Maven, Gradle]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Gradle
        if: matrix.tool == 'Gradle'
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test the Maven example
        if: matrix.tool == 'Maven'
        run: cd example-maven && ./mvnw -B verify

      - name: Build and test the Gradle example
        if: matrix.tool == 'Gradle'
        run: cd example-gradle && ./gradlew --no-daemon --warning-mode all test

  # The two examples are standalone copies of one exercise: keep them identical (the policies differ
  # in the programming language configuration only).
  example-consistency:
    name: Both examples contain the same exercise
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Compare the examples
        run: |
          diff -r example-maven/assignment example-gradle/assignment
          diff -r example-maven/assignment-failing example-gradle/assignment-failing
          diff -r -x SecurityPolicy.yaml example-maven/test example-gradle/test

  # Both examples must work when copied out of the repository. Copies default to the newest framework release from
  # Maven Central; CI tests them against the framework SNAPSHOT of this commit instead, installed into ~/.m2.
  example-copy:
    name: Copy of the ${{ matrix.tool }} example (installed framework)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [Maven, Gradle]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Determine the framework version
        run: |
          VERSION=$(./mvnw -B -q -f framework/pom.xml org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate \
            -Dexpression=project.version -DforceStdout | tail -n 1)
          test -n "$VERSION" || { echo "::error::Could not determine the framework version"; exit 1; }
          echo "Framework version: $VERSION"
          echo "FRAMEWORK_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install the framework locally
        run: ./mvnw -B -f framework/pom.xml install -DskipTests

      - name: Build and test a copy of the Maven example
        if: matrix.tool == 'Maven'
        run: |
          cp -r example-maven "$RUNNER_TEMP/example-maven"
          cd "$RUNNER_TEMP/example-maven" && ./mvnw -B verify -Dlevenshtein.version="$FRAMEWORK_VERSION"

      - name: Set up Gradle
        if: matrix.tool == 'Gradle'
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test a copy of the Gradle example
        if: matrix.tool == 'Gradle'
        run: |
          cp -r example-gradle "$RUNNER_TEMP/example-gradle"
          cd "$RUNNER_TEMP/example-gradle"
          ./gradlew --no-daemon --warning-mode all test -PlevenshteinVersion="$FRAMEWORK_VERSION"

  # assignment-failing/src is a failing example solution: every deliberate defect must fail the build and show
  # its framework message (German, the default language) in the test reports of both build tools.
  failing-solution:
    name: Failing example solution (${{ matrix.tool }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: Maven
            build: cd example-maven && ./mvnw -B -q verify -Dassignment.dir=assignment-failing
            reports: example-maven/target/surefire-reports
          - tool: Gradle
            build: cd example-gradle && ./gradlew --no-daemon -q test -PassignmentDir=assignment-failing
            reports: example-gradle/build/test-results/test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Gradle
        if: matrix.tool == 'Gradle'
        uses: gradle/actions/setup-gradle@v5

      - name: Run the failing example solution
        env:
          BUILD: ${{ matrix.build }}
          REPORTS: ${{ matrix.reports }}
        run: |
          if (eval "$BUILD"); then
            echo "::error::The failing example solution passed the ${{ matrix.tool }} build"; exit 1
          fi
          status=0
          while IFS= read -r marker; do
            grep -rqF -- "$marker" "$REPORTS" || { echo "::error::'$marker' missing in $REPORTS"; status=1; }
          done <<'MARKERS'
          public static final int MAX_SPEED
          public String manufacturer
          protected Integer year
          protected long getYear()
          public class Car extends AbstractVehicle implements Driveable
          void start()
          private Double prize
          calculateCost(long)
          protected Car(String, Integer)
          muss den ungültigen Wert ablehnen
          aber getSpeed() liefert 0.0
          hat eine Ausnahme geworfen
          MARKERS
          exit $status

  # The steps of publish.yml with the release version of this SNAPSHOT, but without GPG and without the upload:
  # problems of the release profile (sources, javadoc, the version change) show up here, before a tag exists.
  release-dry-run:
    name: Release dry run (no signing, no upload)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set the release version (as publish.yml does from the tag)
        run: |
          SNAPSHOT=$(./mvnw -B -q -f framework/pom.xml org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate \
            -Dexpression=project.version -DforceStdout | tail -n 1)
          RELEASE="${SNAPSHOT%-SNAPSHOT}"
          test -n "$RELEASE" || { echo "::error::Could not determine the framework version"; exit 1; }
          echo "RELEASE_VERSION=$RELEASE" >> "$GITHUB_ENV"
          ./mvnw -B -f framework/pom.xml versions:set -DnewVersion="$RELEASE" -DgenerateBackupPoms=false
          git diff --stat

      - name: Build the release artifacts
        run: ./mvnw -B -f framework/pom.xml -P release -Dgpg.skip -DskipTests verify

      - name: Check the release artifacts
        run: |
          for suffix in "" -sources -javadoc; do
            jar="framework/target/levenshtein-testing-framework-${RELEASE_VERSION}${suffix}.jar"
            test -s "$jar" || { echo "::error::$jar is missing"; exit 1; }
            echo "found $jar"
          done
