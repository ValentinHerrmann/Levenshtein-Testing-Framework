name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish_maven:
    name: Publish framework to Maven Central
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          # name of the environment variable holding the passphrase (read by maven-gpg-plugin)
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Build and test everything
        run: ./mvnw -B verify

      - name: Set release version from tag
        if: github.event_name == 'release'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./mvnw -B -f framework/pom.xml versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      # A manual run publishes the current (SNAPSHOT) version of framework/pom.xml.
      - name: Publish package
        env:
          OSSRH_USER: ${{ secrets.OSSRH_USER }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -f framework/pom.xml -P release -s .mvn/settings.xml clean deploy -DskipTests
