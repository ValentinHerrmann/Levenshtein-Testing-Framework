# Documentation site, built with Zensical (https://zensical.org) and published to GitHub Pages by
# .github/workflows/docs.yml. Preview locally: pip install zensical && zensical serve

[project]
site_name = "Levenshtein Testing Framework"
site_description = "Structural and behavioural tests for student code that tolerate small naming deviations, built on Ares 2."
site_author = "Valentin Herrmann"
site_url = "https://valentinherrmann.github.io/Levenshtein-Testing-Framework/"
repo_url = "https://github.com/ValentinHerrmann/Levenshtein-Testing-Framework"
repo_name = "ValentinHerrmann/Levenshtein-Testing-Framework"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; Valentin Herrmann · GPL-3.0"
# internal implementation plans are not part of the user documentation
exclude_docs = """
plans/
"""

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Quick Start" = "quick-start.md" },
    { "Writing Tests" = "writing-tests.md" },
    { "Ares 2 Setup in Detail" = "ares-setup.md" },
  ] },
  { "Reference" = [
    { "How Matching Works" = "matching.md" },
    { "Architecture" = "architecture.md" },
    # the Javadoc is generated by the docs workflow and copied into site/api/
    { "API Reference (Javadoc)" = "https://valentinherrmann.github.io/Levenshtein-Testing-Framework/api/" },
  ] },
  { "Help" = [
    { "FAQ & Troubleshooting" = "faq.md" },
    { "Versions and Migrating" = "migration.md" },
  ] },
  { "Maintainers" = [
    { "Releasing" = "releasing.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
